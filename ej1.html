<!DOCTYPE html>
<html lang="es">
<head>

  <title>Clima por Ciudad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Clima por Ciudad</h1>

      <option value="">-- Selecciona una ciudad --</option>

  </div>

  <script src="script1.js"></script>

</body>
